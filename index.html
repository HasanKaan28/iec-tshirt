<style>
/* Layout: one-screen tool. The shirt turns on a photo-studio stage at the left; the sponsor spots and the request form sit in a panel on the right, stacked under the stage on phones. */
:root {
  --bg: #e8edf4;
  --stage: #e9edf2;
  --stage-hi: #ffffff;
  --stage-lo: #d3dae3;
  --panel: #ffffff;
  --fg: #0f2f52;
  --muted: #4f627a;
  --line: #d3dce7;
  --accent: #154a7f;
  --accent-fg: #ffffff;
  --accent-soft: #e6eef8;
  --honey: #c8961c;
  --ok: #2f7a4a;
  --ok-soft: #e2f0e7;
  --warn: #9a3b2e;
  --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1626; --stage: #142a44; --stage-hi: #23405f; --stage-lo: #0c1b2e; --panel: #102440; --fg: #e7eef7; --muted: #a3b4c8; --line: #233a59;
    --accent: #8db3dc; --accent-fg: #0a1626; --accent-soft: #17314f; --honey: #ecc246; --ok: #7cc293; --ok-soft: #16301f; --warn: #f0a596; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1626; --stage: #142a44; --stage-hi: #23405f; --stage-lo: #0c1b2e; --panel: #102440; --fg: #e7eef7; --muted: #a3b4c8; --line: #233a59;
  --accent: #8db3dc; --accent-fg: #0a1626; --accent-soft: #17314f; --honey: #ecc246; --ok: #7cc293; --ok-soft: #16301f; --warn: #f0a596; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
* { box-sizing: border-box; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 400px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px 16px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { font: 700 20px/1 var(--display); letter-spacing: 0.02em; padding: 6px 9px; border: 2px solid var(--fg); border-radius: 4px; }
.brand-name { font: 600 12px/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font: 600 12px/1 var(--mono); letter-spacing: 0.08em; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.stage {
  position: relative; min-height: 0; border-radius: 14px; overflow: hidden;
  background:
    linear-gradient(to bottom, transparent 72%, rgba(15, 47, 82, 0.05) 100%),
    radial-gradient(110% 80% at 50% 30%, var(--stage-hi) 0%, var(--stage) 55%, var(--stage-lo) 100%);
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.pointing { cursor: pointer; }
#fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 56px 12px; }
.stage-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stage-top .label { font: 600 11px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.swatch { display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 50%; border: 1px solid #9aa5b1; vertical-align: -1px; }
.swatch.gift { border-color: var(--honey); box-shadow: 0 0 0 1.5px var(--honey); }
.stage-bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.hint { font: 500 12px/1.3 var(--mono); color: var(--muted); }

.panel { min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px 26px; display: flex; flex-direction: column; gap: 18px; }
.panel h1 { margin: 0; font: 700 26px/1.12 var(--display); text-wrap: balance; letter-spacing: -0.01em; }
.panel h2 { margin: 0; font: 600 12px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.count { font: 600 12px/1 var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }

.spots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.spot { position: relative; }
.spot input { position: absolute; opacity: 0; pointer-events: none; }
.spot label {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start;
  padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: border-color .15s, background-color .15s;
}
.spot label:hover, .spot.hot label { border-color: var(--honey); }
.spot input:focus-visible + label { outline: 2px solid var(--honey); outline-offset: 2px; }
.spot input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.box { width: 18px; height: 18px; margin-top: 2px; border: 2px solid var(--muted); border-radius: 4px; display: grid; place-items: center; }
.spot input:checked + label .box { background: var(--accent); border-color: var(--accent); }
.spot input:checked + label .box::after { content: ""; width: 5px; height: 9px; border: solid var(--accent-fg); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.spot-name { font: 600 15px/1.25 var(--display); }
.spot-desc { grid-column: 2; font-size: 13px; color: var(--muted); }
.spot-size { font: 600 12px/1.3 var(--mono); color: var(--fg); white-space: nowrap; text-align: right; }
.chip { grid-column: 3; justify-self: end; font: 600 10px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; color: var(--ok); background: var(--ok-soft); }
.spot.taken label { cursor: not-allowed; opacity: 0.6; }
.spot.taken .chip { color: var(--muted); background: var(--accent-soft); }

.err { margin: 0; color: var(--warn); font-size: 13px; font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font: 600 14px/1.2 var(--display); cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 7px 10px; font-size: 12px; }
.btn.ghost[aria-pressed="true"] { background: var(--accent-soft); }
.view { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 7px 11px; font: 600 12px/1 var(--mono); letter-spacing: 0.06em; cursor: pointer; }
.view[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.views { display: flex; gap: 6px; flex-wrap: wrap; }

.row { display: flex; flex-wrap: wrap; gap: 8px; }
.fine { margin: 0; font-size: 12px; color: var(--muted); }
.fine a { color: var(--accent); }

@media (max-width: 860px) {
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; }
  .stage { height: 64svh; min-height: 380px; }
  .panel { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { .spot label { transition: none; } }
/* Presenting: the shirt fills the screen for a meeting; the bar and the panel step aside. */
body.presenting .bar, body.presenting .panel { display: none; }
body.presenting .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); padding: 0; gap: 0; }
body.presenting .stage { height: 100vh; height: 100svh; min-height: 0; border-radius: 0; }
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true">IEC</span><span class="brand-name"><span lang="en">Engineering Club</span>, <span data-t="city"></span></span></div>
    <div class="seg" role="group" aria-label="Language" id="langs">
      <button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="bs">BS</button>
    </div>
  </header>

  <section class="stage" aria-labelledby="stageTitle">
    <h2 id="stageTitle" class="sr-only" data-t="stageTitle"></h2>
    <canvas id="gl"></canvas>
    <img id="fallback" hidden alt="">
    <div class="stage-top">
      <span class="label" data-t="design"></span>
      <div class="seg" role="group" id="designs"></div>
    </div>
    <div class="stage-bottom">
      <div class="views" role="group" id="views">
        <button type="button" class="view" data-view="front" data-t="front"></button>
        <button type="button" class="view" data-view="back" data-t="back"></button>
        <button type="button" class="view" data-view="spin" data-t="spin"></button>
        <button type="button" class="view" id="present" aria-pressed="false" data-t="present"></button>
      </div>
      <span class="hint" data-t="drag"></span>
    </div>
  </section>

  <aside class="panel">
    <h1 data-t="title"></h1>
    <p class="lede" data-t="lede"></p>

    <div class="section">
      <div class="section-head"><h2 data-t="spotsTitle"></h2><span class="count" id="count" aria-live="polite"></span></div>
      <ul class="spots" id="spots"></ul>
    </div>

    <div class="section">
      <h2 data-t="tryTitle"></h2>
      <p class="fine" data-t="tryHelp"></p>
      <div class="row">
        <button class="btn small" type="button" id="logoPick" data-t="tryUpload"></button>
        <button class="btn small ghost" type="button" id="logoWhite" aria-pressed="false" data-t="tryWhite"></button>
        <button class="btn small ghost" type="button" id="logoClear" data-t="tryClear" hidden></button>
      </div>
      <input id="logoFile" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
      <p class="err" id="err" role="alert" hidden></p>
    </div>

    <p class="fine"><span data-t="fine"></span> <a href="https://iusengclub.vercel.app" target="_blank" rel="noopener">iusengclub.vercel.app</a></p>
  </aside>
</div>

<script type="importmap">

<script type="module">

// ---------- shirt outline, in inches: x to the viewer's right on the front, y down from the shoulder line
const SA = 35 * Math.PI / 180, DIR = [Math.cos(SA), Math.sin(SA)], NRM = [-Math.sin(SA), Math.cos(SA)];
const P = { N: [3.9, 0], S: [9.5, 1.7], A: [10.4, 9.6], H: [10.62, 28.5] };
P.C1 = [P.S[0] + 8.5 * DIR[0], P.S[1] + 8.5 * DIR[1]];
P.C2 = [P.C1[0] + 7.6 * NRM[0], P.C1[1] + 7.6 * NRM[1]];
const Y0 = 14.2;
const bez2 = (a, c, b, t) => [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];
const bez3 = (a, b, c, d, t) => { const u = 1 - t; return [u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0], u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1]]; };
const mirror = pts => pts.map(p => [-p[0], p[1]]);
function neckline(drop) {
  const pts = [];
  for (let i = 0; i <= 24; i++) pts.push(bez3([-3.9, 0], [-2.5, drop * 0.75], [-1.3, drop], [0, drop], i / 24));
  for (let i = 1; i <= 24; i++) pts.push(bez3([0, drop], [1.3, drop], [2.5, drop * 0.75], [3.9, 0], i / 24));
  return pts;
}
const UNDERARM = []; for (let i = 0; i <= 12; i++) UNDERARM.push(bez2(P.C2, [P.A[0] + 0.4, P.A[1] + 0.6], P.A, i / 12));
const HEM = []; for (let i = 0; i <= 40; i++) HEM.push(bez2(P.H, [0, 28.74], [-P.H[0], P.H[1]], i / 40));
function segDist(px, py, a, b) {
  const vx = b[0] - a[0], vy = b[1] - a[1];
  const t = Math.max(0, Math.min(1, ((px - a[0]) * vx + (py - a[1]) * vy) / (vx * vx + vy * vy)));
  return Math.hypot(px - a[0] - t * vx, py - a[1] - t * vy);
}
function nearest(px, py, poly) {
  let best = 1e9, bx = px, by = py;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], vx = b[0] - a[0], vy = b[1] - a[1];
    const t = Math.max(0, Math.min(1, ((px - a[0]) * vx + (py - a[1]) * vy) / (vx * vx + vy * vy)));
    const x = a[0] + t * vx, y = a[1] + t * vy, d = Math.hypot(px - x, py - y);
    if (d < best) { best = d; bx = x; by = y; }
  }
  return [bx, by, best];
}
function inside(x, y, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}

// ---------- spots (inches, same coordinates; back spots are as seen from behind)
const SLEEVE = 2.95;
// Sleeve spots sit on the outer side of the sleeve, centred on its top seam: half on the front panel, half on the back.
const SLEEVE_SEAM = [P.S[0] + (P.C1[0] - P.S[0]) * 0.55, P.S[1] + (P.C1[1] - P.S[1]) * 0.55];
const SPOTS = [
  { id: 'front', side: 'front', rect: [-5, 9.0, 10, 3.2], cm: '25 × 8 cm', view: 0 },
  { id: 'chest', side: 'front', rect: [-5.3, 5.2, 3.4, 1.4], cm: '8.5 × 3.5 cm', view: -0.25 },

    const cx = (x % 8) - 3.5, row = (y + Math.abs(cx) * 1.1) % 8;
    hgt[y * N + x] = Math.cos(cx / 4 * Math.PI / 2) * (0.6 + 0.4 * Math.sin(row / 8 * Math.PI * 2)) + (Math.random() - 0.5) * 0.25;
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const hx = hgt[y * N + (x + 1) % N] - hgt[y * N + (x - 1 + N) % N], hy = hgt[((y + 1) % N) * N + x] - hgt[((y - 1 + N) % N) * N + x];
    const i = (y * N + x) * 4;
    img.data[i] = 128 - hx * 60; img.data[i + 1] = 128 + hy * 60; img.data[i + 2] = 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(36, 31);

}
function init3d() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = DESIGNS[state.design].exposure;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  camera = new THREE.PerspectiveCamera(28, 1, 1, 600);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c3cf, 0.2));
  const key = new THREE.DirectionalLight(0xffffff, 1.45); key.position.set(-22, 40, 38);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -22, right: 22, top: 24, bottom: -24, near: 10, far: 140 });
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.04;
  scene.add(key);
  const rimL = new THREE.DirectionalLight(0xdfe9ff, 0.5); rimL.position.set(40, 12, -50); scene.add(rimL);
  const knit = knitNormalMap(), d = DESIGNS[state.design];
  garment = buildGarment(garmentData);
  for (const p of garment.panels) {
    const tex = new THREE.CanvasTexture(canvases[p.side]);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    textures[p.side] = tex;
    const outer = new THREE.MeshPhysicalMaterial({ map: tex, vertexColors: true, roughness: 0.92, envMapIntensity: 0.42, sheen: 1, sheenRoughness: 0.75, sheenColor: new THREE.Color(d.sheen), normalMap: knit, normalScale: new THREE.Vector2(0.32, 0.32) });
    const inner = new THREE.MeshStandardMaterial({ color: d.inner, vertexColors: true, roughness: 1, envMapIntensity: 0.4, side: THREE.BackSide, normalMap: knit, normalScale: new THREE.Vector2(0.3, 0.3) });
    mats.outer.push(outer); mats.inner.push(inner);
    const m = new THREE.Mesh(p.geo, outer);
    m.castShadow = m.receiveShadow = true; m.userData.side = p.side;
    meshes.push(m); scene.add(m);

  // soft contact shadow under the hem
  const sc = document.createElement('canvas'); sc.width = sc.height = 128;
  const sg = sc.getContext('2d'), grd = sg.createRadialGradient(64, 64, 4, 64, 64, 64);
  grd.addColorStop(0, 'rgba(15,47,82,0.26)'); grd.addColorStop(1, 'rgba(15,47,82,0)');
  sg.fillStyle = grd; sg.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(34, 12), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = Y0 - 30.95; scene.add(shadow);

  controls = new OrbitControls(camera, canvas);
  controls.target.set(0, Y0 - 13.5, 0);
  controls.enablePan = false; controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minPolarAngle = 1.05; controls.maxPolarAngle = 2.0;
  controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = 1.1;
  controls.addEventListener('start', () => { controls.autoRotate = false; anim = null; pressView(null); });
  camera.position.set(0, Y0 - 11, 80);
  // ?view=back or ?view=<degrees> opens the shirt turned, for links straight to the back
  const askedView = new URLSearchParams(location.search).get('view');
  const viewDeg = askedView === 'back' ? 180 : parseFloat(askedView);
  if (Number.isFinite(viewDeg)) {
    const a = viewDeg * Math.PI / 180;

function fitDistance() {
  const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight), t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(18 / t, 19.5 / (t * aspect)) + 6;
}
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const dist = fitDistance();
  controls.minDistance = dist * 0.45; controls.maxDistance = dist * 1.4;
  const off = camera.position.clone().sub(controls.target); off.setLength(dist); camera.position.copy(controls.target).add(off);
}
function viewTo(theta) {
  const off = camera.position.clone().sub(controls.target), sph = new THREE.Spherical().setFromVector3(off);
  const dd = ((theta - sph.theta + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  controls.autoRotate = false;
  anim = { t0: performance.now(), from: sph.theta, dd, phi0: sph.phi, phi1: Math.PI / 2 - 0.06, r0: sph.radius, r1: fitDistance(), dur: reduceMotion ? 1 : 750 };
}
function tick(now) {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const sph = new THREE.Spherical(anim.r0 + (anim.r1 - anim.r0) * e, anim.phi0 + (anim.phi1 - anim.phi0) * e, anim.from + anim.dd * e);
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
    if (k >= 1) anim = null;
  }
  controls.update();
  const dt = lastNow === null ? 1 / 60 : Math.min(0.05, Math.max(1e-3, (now - lastNow) / 1000));
  lastNow = now;
  const az = controls.getAzimuthalAngle();
  let dAz = lastAz === null ? 0 : az - lastAz;
  lastAz = az;
  if (dAz > Math.PI) dAz -= 2 * Math.PI; else if (dAz < -Math.PI) dAz += 2 * Math.PI;
  const omega = dAz / dt;
  // the hem lags behind a turn and swings back: a damped spring kicked by changes in turning speed
  swingV += (-30 * swing - 3.2 * swingV) * dt + (omega - lastOmega) * 0.35;
  lastOmega = omega;
  swing = Math.max(-0.35, Math.min(0.35, swing + swingV * dt));
  if (!reduceMotion) deform(now / 1000);
  renderer.render(scene, camera);
}
function focusSpot(s) { if (!controls) return; viewTo(s.view); pressView(null); }
function pressView(v) { for (const b of document.querySelectorAll('#views .view[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === v)); }
for (const b of document.querySelectorAll('#views .view[data-view]')) b.addEventListener('click', () => {
  const v = b.dataset.view;
  if (!controls) return;
  if (v === 'spin') { anim = null; controls.autoRotate = !controls.autoRotate; pressView(controls.autoRotate ? 'spin' : null); return; }
  viewTo(v === 'front' ? 0 : Math.PI); pressView(v);
});
// ---------- presenting: the shirt fills the screen for a meeting, and the keyboard turns it
function renderPresent() {
  const on = document.body.classList.contains('presenting');
  $('present').textContent = on ? tx().exitPresent : tx().present;
  $('present').setAttribute('aria-pressed', String(on));
  document.querySelector('.hint').textContent = on ? tx().keys : tx().drag;
}
function setPresenting(on) {
  document.body.classList.toggle('presenting', on);
  renderPresent();
  if (on) document.documentElement.requestFullscreen?.().catch(() => { /* the frame may not allow full screen */ });
  else if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
}
$('present').addEventListener('click', () => setPresenting(!document.body.classList.contains('presenting')));
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('presenting')) setPresenting(false);
});
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase(), presenting = document.body.classList.contains('presenting');
  if (k === 'escape' && presenting) setPresenting(false);
  if (k === 'p') setPresenting(!presenting);

function spotAt(side, x, y) {
  for (const s of SPOTS) {
    if (s.sleeve) {
      const m = side === 'back' ? -s.sleeve : s.sleeve;
      const dx = x - SLEEVE_SEAM[0] * m, dy = y - SLEEVE_SEAM[1], a = m * SA;
      const lx = dx * Math.cos(a) + dy * Math.sin(a), ly = -dx * Math.sin(a) + dy * Math.cos(a);
      if (Math.abs(lx) <= SLEEVE / 2 && Math.abs(ly) <= SLEEVE / 2) return s;
    } else if (s.side === side) {
      const [rx, ry, rw, rh] = s.rect;

function setupPicking() {
